services:
  db:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_store_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - online_store_postgres_data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${POSTGRES_USER:-postgres}
          -d ${POSTGRES_DB:-online_store_db}
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  online_store_postgres_data:
